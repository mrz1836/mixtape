project:
  name: mixtape
  binary: mixtape
  module: github.com/mrz1836/mixtape
  main: ./cmd/mixtape/main.go

build:
  # Custom ldflags with version injection
  ldflags:
    - "-s -w"
    - "-X main.version={{.Version}}"
    - "-X main.commit={{.Commit}}"
    - "-X main.buildDate={{.Date}}"
  flags:
    - "-trimpath"
  output: "./cmd/mixtape"

test:
  # Match CI timeout configuration (TEST_TIMEOUT_RACE_COVER in .github/env/00-core.env)
  # Default magex timeout is 10m which was killing tests prematurely
  timeout: 30m
