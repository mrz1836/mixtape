project:
  name: mixtape
  binary: mixtape
  module: github.com/mrz1836/mixtape
  main: ./cmd/mixtape/main.go
build:
  # Custom ldflags with version injection (read by `mixtape version`)
  ldflags:
    - "-s -w"
    - "-X main.version={{.Version}}"
    - "-X main.commit={{.Commit}}"
    - "-X main.buildDate={{.Date}}"
  flags:
    - "-trimpath"
  output: "./cmd/mixtape"
test:
  # Match CI timeout configuration (the default magex timeout is 10m)
  timeout: 30m
