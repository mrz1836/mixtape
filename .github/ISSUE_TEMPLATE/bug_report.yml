name: Bug report
description: Report something Mixtape got wrong (a song cut short, a wrong error, a crash)
title: "[Bug] <brief description of the issue>"
labels: ["bug-P3"]
assignees:
  - mrz1836
body:
  - type: markdown
    attributes:
      value: |
        **⚠️ Do not include personal data.** Logs can contain your home folder path and the names of
        your playlists; redact what you would rather not share.

  - type: textarea
    id: bug_description
    attributes:
      label: What went wrong
      description: A clear summary of the problem.
      placeholder: The second song of the playlist was discarded with "the song did not play to its end".
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: The command you ran, and what Spotify was doing at the time.
      placeholder: |
        1. mixtape record https://open.spotify.com/playlist/... --mute
        2. Spotify was paused on another song when the command started
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
      placeholder: Every song in the playlist is recorded once, start to finish.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of these commands.
      placeholder: |
        - mixtape version
        - mixtape doctor -o json
        - macOS version (Apple menu → About This Mac) and Spotify version (Spotify → About Spotify)
        - capture method: tap or device (BlackHole)
      render: text
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Session events
      description: |
        The session's event log helps most: `~/.mixtape/sessions/<session-id>.ndjson`
        (`mixtape status` names it). Rerunning with `-v` adds timing details.
      render: text
    validations:
      required: false
